name: Deploy Docs

# main 的 CI 通過後才部署文檔站到 GitHub Pages；也可在 Actions 頁手動觸發。
# 首次使用前需在 repo Settings → Pages → Build and deployment 將 Source 設為「GitHub Actions」。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一個進行中的部署；新的部署排隊等待，不中斷正在發布的版本
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run 會在 CI 失敗時也觸發，只在成功時部署
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 預設 checkout 預設分支最新 commit，改為 CI 實際驗證過的那個
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 取得 Pages 網址：專案站為 https://<owner>.github.io + /<repo>，自訂網域時 base_path 為空
      - name: 設定 GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # npm ci 觸發 prepare → build:all，文檔站的 cubby-ui.js 與 CSS 由此產生
      - name: 安裝依賴並建置套件
        run: npm ci

      - name: 建置文檔站
        run: npm run build:docs
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: 站內連結檢查
        run: npm run check:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
