name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# 同一分支的新 push 取消尚在執行的舊 run，節省額度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci 會觸發 prepare → build:all（build + build:blade），
      # 因此安裝步驟本身即驗證了 NPM 套件與 Blade 元件可正常建置。
      - name: 安裝依賴並建置（prepare 執行 build:all）
        run: npm ci

      - name: 元件清單同步檢查
        run: npm run check:sync

      # astro check（文檔站）+ tsc -p tsconfig.scripts.json（src/scripts/ 互動元件 JS 的 checkJs）
      - name: 型別檢查
        run: npm run type-check

      - name: Lint（ESLint，互動元件 JS 正確性規則）
        run: npm run lint

      - name: Blade 回歸測試
        run: npm run test:blade

      - name: 安裝 Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 以 GitHub Pages 專案站的子路徑建置，smoke test 與連結檢查驗證的即為實際部署設定
      # （寫死根路徑的連結或資源會在此失敗）；與 deploy-docs.yml 由 configure-pages 取得的值一致。
      # SITE_URL 讓建置產生 sitemap、robots.txt 的 Sitemap 與 canonical 絕對網址，供 smoke test 的 SEO 檢查驗證
      - name: 建置文檔站（site：dennykuo.github.io，base：/cubby-ui）
        run: npm run build:docs
        env:
          SITE_URL: https://dennykuo.github.io
          BASE_PATH: /cubby-ui

      - name: 站內連結檢查
        run: npm run check:links
        env:
          BASE_PATH: /cubby-ui

      - name: 互動元件 E2E 測試（Playwright，含文檔站 smoke）
        run: npm run test:e2e
        env:
          BASE_PATH: /cubby-ui
