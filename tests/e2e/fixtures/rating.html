<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rating fixture</title>
    <link rel="stylesheet" href="../../../dist/core/cubby-ui.css" />
  </head>
  <body>
    <button id="before" type="button">Before</button>

    <!-- 放在 <form> 內、星星沒有 type：JS 應補上 type="button"，點擊不送出表單 -->
    <form id="form" action="#">
      <div id="basic" class="cu-rating" data-cu-rating data-cu-rating-value="0">
        <button class="cu-rating-item" data-cu-rating-star="1">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </button>
        <button class="cu-rating-item" data-cu-rating-star="2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </button>
        <button class="cu-rating-item" data-cu-rating-star="3">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </button>
        <button class="cu-rating-item" data-cu-rating-star="4">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </button>
        <button class="cu-rating-item" data-cu-rating-star="5">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </button>
      </div>
    </form>

    <!-- 預設值 3、自訂群組名稱與星星名稱模板；第 5 顆自帶 aria-label 不應被覆寫 -->
    <div
      id="preset"
      class="cu-rating"
      data-cu-rating
      data-cu-rating-value="3"
      aria-label="Rate this product"
      data-cu-rating-star-text="{value} 顆星"
    >
      <button type="button" class="cu-rating-item" data-cu-rating-star="1">★</button>
      <button type="button" class="cu-rating-item" data-cu-rating-star="2">★</button>
      <button type="button" class="cu-rating-item" data-cu-rating-star="3">★</button>
      <button type="button" class="cu-rating-item" data-cu-rating-star="4">★</button>
      <button type="button" class="cu-rating-item" data-cu-rating-star="5" aria-label="Excellent">★</button>
    </div>

    <!-- 舊版 <span> 星星標記：仍可用鍵盤操作 -->
    <p id="spans-label">Service</p>
    <div id="spans" class="cu-rating" data-cu-rating data-cu-rating-value="2" aria-labelledby="spans-label">
      <span class="cu-rating-item" data-cu-rating-star="1">★</span>
      <span class="cu-rating-item" data-cu-rating-star="2">★</span>
      <span class="cu-rating-item" data-cu-rating-star="3">★</span>
    </div>

    <div id="readonly" class="cu-rating cu-rating-readonly" data-cu-rating data-cu-rating-value="4">
      <button type="button" class="cu-rating-item cu-rating-item-active" data-cu-rating-star="1">★</button>
      <button type="button" class="cu-rating-item cu-rating-item-active" data-cu-rating-star="2">★</button>
      <button type="button" class="cu-rating-item cu-rating-item-active" data-cu-rating-star="3">★</button>
      <button type="button" class="cu-rating-item cu-rating-item-active" data-cu-rating-star="4">★</button>
      <button type="button" class="cu-rating-item" data-cu-rating-star="5">★</button>
    </div>

    <div id="disabled" class="cu-rating cu-rating-disabled" data-cu-rating data-cu-rating-value="2">
      <button type="button" class="cu-rating-item cu-rating-item-active" data-cu-rating-star="1">★</button>
      <button type="button" class="cu-rating-item cu-rating-item-active" data-cu-rating-star="2">★</button>
      <button type="button" class="cu-rating-item" data-cu-rating-star="3">★</button>
    </div>

    <div id="rtl" dir="rtl" class="cu-rating" data-cu-rating data-cu-rating-value="2">
      <button type="button" class="cu-rating-item" data-cu-rating-star="1">★</button>
      <button type="button" class="cu-rating-item" data-cu-rating-star="2">★</button>
      <button type="button" class="cu-rating-item" data-cu-rating-star="3">★</button>
    </div>

    <button id="after" type="button">After</button>

    <script>
      window.__changes = [];
      window.__submits = 0;
      document.addEventListener("cu:rating:change", function (e) {
        window.__changes.push([e.target.id, e.detail.value]);
      });
      document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        window.__submits++;
      });
    </script>
    <script src="../../../dist/core/cubby-ui.js"></script>
  </body>
</html>
