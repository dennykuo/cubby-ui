<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabs fixture</title>
    <link rel="stylesheet" href="../../../dist/core/cubby-ui.css" />
  </head>
  <body>
    <div id="basic" class="cu-tabs" data-cu-tabs>
      <div class="cu-tabs-list">
        <button class="cu-tabs-trigger cu-tabs-trigger-active" data-cu-tabs-trigger="tab1">Tab 1</button>
        <button class="cu-tabs-trigger" data-cu-tabs-trigger="tab2">Tab 2</button>
      </div>
      <div class="cu-tabs-content" data-cu-tabs-content="tab1">Panel 1</div>
      <div class="cu-tabs-content" data-cu-tabs-content="tab2" hidden>Panel 2</div>
    </div>

    <!-- 舊版標記：關閉圖示為 role="button" tabindex="0"（巢狀互動元素），JS 會改為純滑鼠目標 -->
    <div id="closable" class="cu-tabs" data-cu-tabs>
      <div class="cu-tabs-list">
        <button class="cu-tabs-trigger" data-cu-tabs-trigger="a">
          A
          <span class="cu-tabs-trigger-close" data-cu-tabs-close role="button" tabindex="0" aria-label="Close A"
            >×</span
          >
        </button>
        <button class="cu-tabs-trigger cu-tabs-trigger-active" data-cu-tabs-trigger="b">
          B
          <span class="cu-tabs-trigger-close" data-cu-tabs-close role="button" tabindex="0" aria-label="Close B"
            >×</span
          >
        </button>
      </div>
      <div class="cu-tabs-content" data-cu-tabs-content="a" hidden>Panel A</div>
      <div class="cu-tabs-content" data-cu-tabs-content="b">Panel B</div>
    </div>

    <!-- 文檔 Closable 範例：關閉圖示 aria-hidden，鍵盤以 Delete 關閉 -->
    <div id="files" class="cu-tabs" data-cu-tabs>
      <div class="cu-tabs-list">
        <button class="cu-tabs-trigger" data-cu-tabs-trigger="index">
          index.ts <span class="cu-tabs-trigger-close" data-cu-tabs-close aria-hidden="true">×</span>
        </button>
        <button class="cu-tabs-trigger cu-tabs-trigger-active" data-cu-tabs-trigger="styles">
          styles.css <span class="cu-tabs-trigger-close" data-cu-tabs-close aria-hidden="true">×</span>
        </button>
        <button class="cu-tabs-trigger" data-cu-tabs-trigger="app">
          app.tsx <span class="cu-tabs-trigger-close" data-cu-tabs-close aria-hidden="true">×</span>
        </button>
        <button class="cu-tabs-trigger" data-cu-tabs-trigger="readme">README.md</button>
      </div>
      <div class="cu-tabs-content" data-cu-tabs-content="index" hidden>Content of index.ts</div>
      <div class="cu-tabs-content" data-cu-tabs-content="styles">Content of styles.css</div>
      <div class="cu-tabs-content" data-cu-tabs-content="app" hidden>Content of app.tsx</div>
      <div class="cu-tabs-content" data-cu-tabs-content="readme" hidden>Content of README.md</div>
    </div>

    <!-- 垂直排列 + 停用的 tab：方向鍵改用上 / 下，跳過停用項目 -->
    <div id="vertical" class="cu-tabs cu-tabs-vertical" data-cu-tabs>
      <div class="cu-tabs-list cu-tabs-list-vertical">
        <button class="cu-tabs-trigger cu-tabs-trigger-active" data-cu-tabs-trigger="v1">V1</button>
        <button class="cu-tabs-trigger" data-cu-tabs-trigger="v2" disabled>V2</button>
        <button class="cu-tabs-trigger" data-cu-tabs-trigger="v3">V3</button>
      </div>
      <div class="cu-tabs-content" data-cu-tabs-content="v1">Panel V1</div>
      <div class="cu-tabs-content" data-cu-tabs-content="v2" hidden>Panel V2</div>
      <div class="cu-tabs-content" data-cu-tabs-content="v3" hidden>Panel V3</div>
    </div>

    <div id="rtl" class="cu-tabs" dir="rtl" data-cu-tabs>
      <div class="cu-tabs-list">
        <button class="cu-tabs-trigger cu-tabs-trigger-active" data-cu-tabs-trigger="r1">R1</button>
        <button class="cu-tabs-trigger" data-cu-tabs-trigger="r2">R2</button>
      </div>
      <div class="cu-tabs-content" data-cu-tabs-content="r1">Panel R1</div>
      <div class="cu-tabs-content" data-cu-tabs-content="r2" hidden>Panel R2</div>
    </div>

    <script>
      window.__closed = [];
      ["closable", "files"].forEach(function (id) {
        document.getElementById(id).addEventListener("cu:tabs:close", function (e) {
          window.__closed.push(e.detail.value);
        });
      });
    </script>
    <script src="../../../dist/core/cubby-ui.js"></script>
  </body>
</html>
