<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rating radio fixture</title>
    <link rel="stylesheet" href="../../../dist/core/cubby-ui.css" />
  </head>
  <body>
    <button id="before" type="button">Before</button>

    <!-- 不需 JS 的表單評分：label 包住 visually hidden radio 與星星，預設值 3 -->
    <form id="form" action="#">
      <div id="radio" class="cu-rating" role="radiogroup" aria-label="Rate this product">
        <label class="cu-rating-label">
          <input type="radio" class="cu-rating-input" name="rating" value="1" aria-label="1 star" />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </label>
        <label class="cu-rating-label">
          <input type="radio" class="cu-rating-input" name="rating" value="2" aria-label="2 stars" />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </label>
        <label class="cu-rating-label">
          <input type="radio" class="cu-rating-input" name="rating" value="3" aria-label="3 stars" checked />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </label>
        <label class="cu-rating-label">
          <input type="radio" class="cu-rating-input" name="rating" value="4" aria-label="4 stars" />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </label>
        <label class="cu-rating-label">
          <input type="radio" class="cu-rating-input" name="rating" value="5" aria-label="5 stars" />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
          </svg>
        </label>
      </div>
    </form>

    <!-- 停用：每個 radio 都加 disabled -->
    <div id="disabled" class="cu-rating" role="radiogroup" aria-label="Disabled rating">
      <label class="cu-rating-label">
        <input type="radio" class="cu-rating-input" name="disabled" value="1" aria-label="1 star" disabled checked />
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
        </svg>
      </label>
      <label class="cu-rating-label">
        <input type="radio" class="cu-rating-input" name="disabled" value="2" aria-label="2 stars" disabled />
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="12 2 15 9 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 9" />
        </svg>
      </label>
    </div>

    <button id="after" type="button">After</button>

    <script src="../../../dist/core/cubby-ui.js"></script>
  </body>
</html>
