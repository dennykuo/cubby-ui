<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Date Picker fixture</title>
  <link rel="stylesheet" href="../../../dist/core/cubby-ui.css" />
  <style>
    body { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; padding: 16px; }
  </style>
</head>
<body>
  <!-- 文檔 Usage 範例 -->
  <form id="form" action="#" onsubmit="event.preventDefault(); window.__submits = (window.__submits || 0) + 1;">
    <div id="dp-basic" class="cu-date-picker" data-cu-date-picker style="width: 240px;">
      <button type="button" class="cu-date-picker-trigger" data-cu-date-picker-trigger>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cu-date-picker-trigger-icon"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <span data-cu-date-picker-value class="cu-date-picker-trigger-placeholder">Pick a date</span>
      </button>
      <input type="hidden" name="date" data-cu-date-picker-input />
      <div class="cu-date-picker-content" data-cu-date-picker-content>
        <div class="cu-calendar" data-cu-calendar>
          <div class="cu-calendar-header">
            <button type="button" class="cu-calendar-nav" data-cu-calendar-prev aria-label="Previous month">&#8249;</button>
            <span class="cu-calendar-title" data-cu-calendar-title></span>
            <button type="button" class="cu-calendar-nav" data-cu-calendar-next aria-label="Next month">&#8250;</button>
          </div>
          <div class="cu-calendar-weekdays">
            <span class="cu-calendar-weekday">Su</span><span class="cu-calendar-weekday">Mo</span><span class="cu-calendar-weekday">Tu</span><span class="cu-calendar-weekday">We</span><span class="cu-calendar-weekday">Th</span><span class="cu-calendar-weekday">Fr</span><span class="cu-calendar-weekday">Sa</span>
          </div>
          <div class="cu-calendar-grid" data-cu-calendar-grid></div>
        </div>
      </div>
    </div>
  </form>

  <!-- 文檔 Default Value 範例 -->
  <div id="dp-default" class="cu-date-picker" data-cu-date-picker style="width: 240px;">
    <button type="button" class="cu-date-picker-trigger" data-cu-date-picker-trigger>
      <span data-cu-date-picker-value>2026/03/15</span>
    </button>
    <input type="hidden" data-cu-date-picker-input value="2026-03-15" />
    <div class="cu-date-picker-content" data-cu-date-picker-content>
      <div class="cu-calendar" data-cu-calendar>
        <div class="cu-calendar-header">
          <button type="button" class="cu-calendar-nav" data-cu-calendar-prev aria-label="Previous month">&#8249;</button>
          <span class="cu-calendar-title" data-cu-calendar-title></span>
          <button type="button" class="cu-calendar-nav" data-cu-calendar-next aria-label="Next month">&#8250;</button>
        </div>
        <div class="cu-calendar-weekdays">
          <span class="cu-calendar-weekday">Su</span><span class="cu-calendar-weekday">Mo</span><span class="cu-calendar-weekday">Tu</span><span class="cu-calendar-weekday">We</span><span class="cu-calendar-weekday">Th</span><span class="cu-calendar-weekday">Fr</span><span class="cu-calendar-weekday">Sa</span>
        </div>
        <div class="cu-calendar-grid" data-cu-calendar-grid></div>
      </div>
    </div>
  </div>

  <!-- 文檔 Min/Max Date Range 範例：只允許 2026-03-10 ~ 2026-04-20 -->
  <div id="dp-range" class="cu-date-picker" data-cu-date-picker style="width: 240px;">
    <button type="button" class="cu-date-picker-trigger" data-cu-date-picker-trigger>
      <span data-cu-date-picker-value class="cu-date-picker-trigger-placeholder">Pick a date</span>
    </button>
    <input type="hidden" data-cu-date-picker-input />
    <div class="cu-date-picker-content" data-cu-date-picker-content>
      <div class="cu-calendar" data-cu-calendar data-cu-calendar-min="2026-03-10" data-cu-calendar-max="2026-04-20">
        <div class="cu-calendar-header">
          <button type="button" class="cu-calendar-nav" data-cu-calendar-prev aria-label="Previous month">&#8249;</button>
          <span class="cu-calendar-title" data-cu-calendar-title></span>
          <button type="button" class="cu-calendar-nav" data-cu-calendar-next aria-label="Next month">&#8250;</button>
        </div>
        <div class="cu-calendar-weekdays">
          <span class="cu-calendar-weekday">Su</span><span class="cu-calendar-weekday">Mo</span><span class="cu-calendar-weekday">Tu</span><span class="cu-calendar-weekday">We</span><span class="cu-calendar-weekday">Th</span><span class="cu-calendar-weekday">Fr</span><span class="cu-calendar-weekday">Sa</span>
        </div>
        <div class="cu-calendar-grid" data-cu-calendar-grid></div>
      </div>
    </div>
  </div>

  <!-- 文檔 Standalone Calendar 範例 -->
  <div style="width: 280px;">
    <div id="cal" class="cu-calendar" data-cu-calendar>
      <div class="cu-calendar-header">
        <button type="button" class="cu-calendar-nav" data-cu-calendar-prev aria-label="Previous month">&#8249;</button>
        <span class="cu-calendar-title" data-cu-calendar-title></span>
        <button type="button" class="cu-calendar-nav" data-cu-calendar-next aria-label="Next month">&#8250;</button>
      </div>
      <div class="cu-calendar-weekdays">
        <span class="cu-calendar-weekday">Su</span><span class="cu-calendar-weekday">Mo</span><span class="cu-calendar-weekday">Tu</span><span class="cu-calendar-weekday">We</span><span class="cu-calendar-weekday">Th</span><span class="cu-calendar-weekday">Fr</span><span class="cu-calendar-weekday">Sa</span>
      </div>
      <div class="cu-calendar-grid" data-cu-calendar-grid></div>
    </div>
  </div>

  <button id="outside" class="cu-button cu-button-ghost">Outside</button>

  <script>
    window.__changes = [];
    document.addEventListener("change", function (e) {
      if (e.target.matches("[data-cu-date-picker-input]")) {
        window.__changes.push({ id: e.target.closest("[data-cu-date-picker]").id, value: e.target.value });
      }
    });
  </script>
  <script src="../../../dist/core/cubby-ui.js"></script>
</body>
</html>
