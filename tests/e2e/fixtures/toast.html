<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Toast fixture</title>
  <link rel="stylesheet" href="../../../dist/core/cubby-ui.css" />
</head>
<body>
  <button id="trigger" class="cu-button cu-button-default"
    data-cu-toast-trigger
    data-cu-toast-title="Saved!"
    data-cu-toast-description="Your changes have been saved."
    data-cu-toast-variant="success"
    data-cu-toast-duration="0">
    Save
  </button>

  <div class="cu-toast-container cu-toast-container-bottom-right" data-cu-toast-container data-cu-toast-max="3"></div>

  <script src="../../../dist/core/cubby-ui.js"></script>
</body>
</html>
