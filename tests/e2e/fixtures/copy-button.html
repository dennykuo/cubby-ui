<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Copy Button fixture</title>
  <link rel="stylesheet" href="../../../dist/core/cubby-ui.css" />
  <script>
    // 在載入 cubby-ui.js 之前攔截 document 級 listener 註冊，統計各事件型別的淨數量
    window.__listeners = {};
    (function () {
      var add = document.addEventListener.bind(document);
      var remove = document.removeEventListener.bind(document);
      document.addEventListener = function (type, fn, opts) {
        window.__listeners[type] = (window.__listeners[type] || 0) + 1;
        return add(type, fn, opts);
      };
      document.removeEventListener = function (type, fn, opts) {
        window.__listeners[type] = (window.__listeners[type] || 0) - 1;
        return remove(type, fn, opts);
      };
    })();
    window.__events = [];
    document.addEventListener("cu:copy-button:copy", function (e) { window.__events.push({ type: "copy", text: e.detail.text }); });
    document.addEventListener("cu:copy-button:error", function (e) { window.__events.push({ type: "error" }); });
  </script>
</head>
<body>
  <!-- data-cu-copy：直接複製屬性值 -->
  <button id="by-value" type="button" class="cu-copy-button" data-cu-copy="usr_8f2a91c4" data-cu-copy-duration="400" aria-label="Copy user ID">
    <svg class="cu-copy-button-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" /></svg>
    <svg class="cu-copy-button-check" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
  </button>

  <!-- data-cu-copy-target：複製元素文字（去除首尾空白）+ label 切換 + 自訂訊息 -->
  <div class="cu-copy-field">
    <code id="order-id" class="cu-copy-field-value">
      ord_01J9ZK4X7M2QH8
    </code>
    <button id="by-target" type="button" class="cu-copy-button" data-cu-copy-target="#order-id" data-cu-copy-success-text="ID copied" data-cu-copy-duration="400">
      <svg class="cu-copy-button-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" /></svg>
      <svg class="cu-copy-button-check" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      <span data-cu-copy-label>Copy</span>
    </button>
  </div>

  <!-- data-cu-copy-target 指向 input：複製目前的 value -->
  <input id="api-key" class="cu-input" type="text" value="sk_live_initial" />
  <button id="by-input" type="button" class="cu-copy-button" data-cu-copy-target="#api-key" aria-label="Copy API key">Copy</button>

  <!-- 找不到目標：失敗狀態 -->
  <button id="missing-target" type="button" class="cu-copy-button" data-cu-copy-target="#does-not-exist" data-cu-copy-error-text="Nothing to copy" data-cu-copy-duration="400">
    <span data-cu-copy-label>Copy</span>
  </button>

  <button id="disabled" type="button" class="cu-copy-button" data-cu-copy="should-not-copy" disabled aria-label="Copy">Copy</button>

  <div id="host"></div>

  <script src="../../../dist/core/cubby-ui.js"></script>
</body>
</html>
